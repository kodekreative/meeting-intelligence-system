version: '3.9'

services:
  # Redis - Cache and Job Queue
  redis:
    image: redis:7-alpine
    container_name: meeting-intel-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Backend API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: meeting-intel-api
    ports:
      - '3001:3001'
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      redis:
        condition: service_healthy
    command: npm run dev --workspace=api
    restart: unless-stopped

  # Frontend Web App
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: meeting-intel-web
    ports:
      - '3000:3000'
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - api
    command: npm run dev --workspace=web
    restart: unless-stopped

  # Worker - Background job processor
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: meeting-intel-worker
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_MODE=true
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      redis:
        condition: service_healthy
    command: npm run worker --workspace=api
    restart: unless-stopped

volumes:
  redis-data:
    driver: local

networks:
  default:
    name: meeting-intel-network
